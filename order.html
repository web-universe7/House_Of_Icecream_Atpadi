<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Order | House of Ice-Cream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/order.js" defer></script>
</head>
<body>
  <main class="order-document">
    <nav class="order-page-navigation" aria-label="Order page navigation">
      <a href="index.html">Home Page</a>
      <a href="menu.html">Continue Shopping</a>
    </nav>
    <section class="order-sheet" aria-labelledby="order-title">
      <header class="order-heading">
        <p class="catalog-kicker">House of Ice-Cream</p>
        <h1 id="order-title">Your Order</h1>
      </header>
      <p class="order-status" data-order-status role="status" aria-live="polite" hidden></p>
      <p class="order-empty" data-order-empty>Your order is empty. Add items from the menu to get started.</p>
      <ul class="order-summary-list" data-order-items aria-label="Items in your order"></ul>
      <div class="order-total">
        <span>Total</span>
        <strong data-order-total>₹0</strong>
      </div>
      <form class="order-form" data-order-form>
        <h2>Customer details</h2>
        <label for="customer-name">Name</label>
        <input id="customer-name" name="customerName" autocomplete="name" required>

        <label for="customer-phone">Phone number</label>
        <input id="customer-phone" name="customerPhone" type="tel" autocomplete="tel" required>

        <label class="order-confirmation">
          <input id="order-confirmation" name="orderConfirmation" type="checkbox" value="yes" required>
          <span>I confirm my order details are correct.</span>
        </label>
        <p class="order-confirmation-note">Your order will open in WhatsApp for you to send.</p>
        <button class="place-order-button" data-order-submit type="submit" disabled>Send Order via WhatsApp</button>
      </form>
    </section>
  </main>
</body>
</html>
