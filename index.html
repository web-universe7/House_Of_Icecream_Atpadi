<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House of Ice-Cream, Atpadi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,500&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="home">
    <h1 class="brand" aria-label="House of Ice-Cream">
      <span class="line line-1"><span class="big">House</span> of</span>
      <span class="line line-2">Ice-Cream</span>
    </h1>

    <a class="btn" href="menu.html">View Menu</a>

    <div class="treat-marquee" aria-label="Ice cream cones, glasses, and cups">
      <div class="treat-track">
        <div class="treat-group">
          <img src="images/green_cone.png" alt="Green ice cream cone">
          <img src="images/glass2.png" alt="Ice cream glass">
          <img src="images/cup3.png" alt="Ice cream cup">
          <img src="images/pink_cone.png" alt="Pink ice cream cone">
          <img src="images/glass1.png" alt="Ice cream glass">
          <img src="images/cup2.png" alt="Ice cream cup">
          <img src="images/yellow_cone.png" alt="Yellow ice cream cone">
          <img src="images/glass3.png" alt="Ice cream glass">
          <img src="images/cup1.png" alt="Ice cream cup">
        </div>
        <div class="treat-group" aria-hidden="true">
          <img src="images/green_cone.png" alt="">
          <img src="images/glass2.png" alt="">
          <img src="images/cup3.png" alt="">
          <img src="images/pink_cone.png" alt="">
          <img src="images/glass1.png" alt="">
          <img src="images/cup2.png" alt="">
          <img src="images/yellow_cone.png" alt="">
          <img src="images/glass3.png" alt="">
          <img src="images/cup1.png" alt="">
        </div>
      </div>
    </div>

    <section class="shop-image-wrap" aria-label="Ice cream shop photo">
      <img src="images/shop1.png" alt="House of Ice-Cream shop" class="shop-image">
    </section>

    <div class="social-icons" role="group" aria-label="Social media icons">
      <span class="social-icon whatsapp-icon">
        <img src="images/whatsapp.png" alt="WhatsApp">
      </span>
      <span class="social-icon instagram-icon">
        <img src="images/Instagram.png" alt="Instagram">
      </span>
      <span class="social-icon google-icon">
        <img src="images/google.png" alt="Google">
      </span>
    </div>
  </main>
</body>
</html>
